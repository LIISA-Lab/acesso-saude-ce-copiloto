<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copiloto Acesso Saúde</title>
  <link rel="stylesheet" href="styles.css">

</head>

<body>
  <div class="container">
    <header>
      <div class="header-title">
        <h2>
          Copiloto LIISA
        </h2>
      </div>

      <p>Apoio à Decisão Clínica</p>
    </header>

    <div class="summary-box" id="resumoBox">
      <p>Carregando resumo clínico...</p>
    </div>

    <div id="tabs" class="tabs">
      <button id="btn-chat" class="tab selected">🗩 Chat</button>
      <button id="btn-escriba" class="tab">🗣 Registro da Consulta</button>
    </div>

    <details class="resumo" id="resumoDetails" open>
      <summary> <span class="resumo-icone">🗎</span> Resumo clínico do paciente</summary>
      <div class="resumo-corpo">
        <p id="resumo-texto">Carregando resumo...</p>
        <dl>
          <dt>Queixas recorrentes</dt>
          <dd id="resumo-queixas">—</dd>
          <dt>Medicações em uso</dt>
          <dd id="resumo-medicacoes">—</dd>
          <dt>Alergias</dt>
          <dd id="resumo-alergias">—</dd>
          <dt>Último atendimento</dt>
          <dd id="resumo-ultimo">—</dd>
        </dl>
      </div>
    </details>

    <div class="scribe-box" id="scribeBox">

      <div class="scribe-content">

        <div class="scribe-icon">
          ✦
        </div>

        <div class="scribe-text">
          <div class="scribe-info">
            <strong>
              <IoMicOutline />
              Escriba AI
            </strong>

            <p id="scribeStatus">
              Transcreva a consulta e preencha o prontuário.
            </p>
          </div>

          <div class="scribe-controls">

            <button id="btnRecord" class="btn-record" type="button">
              <span class="record-dot"></span>
              Gravar consulta
            </button>

            <button id="btnStop" class="btn-stop" type="button" style="display: none;">
              <span class="stop-icon"></span>
              Gravando
              <div class="timer">
                <label id="minutes">00</label>:<label id="seconds">00</label>
              </div>
            </button>

          </div>
        </div>

      </div>

      <div id="scribeTranscript" class="scribe-transcript" style="display: none;"></div>

    </div>

    <div class="chat-container" id="chatContainer">
      <!-- Mensagens vão aqui -->
    </div>

    <div class="input-area" id="inputArea">
      <input type="text" id="chatInput" maxlength="2000" placeholder="Pergunte sobre o histórico...">
      <button id="sendBtn">Enviar</button>
    </div>
  </div>

  <!-- O JS precisa importar o módulo wasm como ES module -->
  <script src="/config.js"></script>
  <script type="module" src="alternar-abas.js"></script>
  <script type="module" src="panel.js"></script>
</body>

</html>
