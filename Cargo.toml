[package]
name = "acesso-saude-ce-copiloto"
version = "0.1.0"
edition = "2024"
description = "Copiloto Acesso Saúde CE - Assistente Wasm"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0"
console_error_panic_hook = "0.1.7"
regex = "1.10.4"
reqwest = { version = "0.13.4", features = ["json"] }
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = ["Window", "console"] }
dotenvy_macro = "0.15.7"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
